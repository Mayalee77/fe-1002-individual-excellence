<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>优秀个人作品合集 ·《中华与世界：文明互鉴与未来展望》</title>
  <style>
    :root{
      --bg:#eef3fb;
      --card:#ffffff;
      --ink:#1d2a44;
      --muted:#61708c;
      --line:#c8d4ea;
      --primary:#2a59d1;
      --primary-soft:#dbe7ff;
      --ok:#2c7b45;
      --ok-soft:#dcf3e4;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      color:var(--ink);
      background:radial-gradient(1200px 800px at 10% -20%, #dce7ff 0%, var(--bg) 50%, #eaf0f8 100%);
      font-family:"Avenir Next","Segoe UI",sans-serif;
      line-height:1.45;
    }
    .page{
      width:min(1200px,92vw);
      margin:26px auto 42px;
    }
    .hero{
      background:rgba(255,255,255,.86);
      border:1px solid var(--line);
      border-radius:28px;
      padding:28px 30px;
      box-shadow:0 12px 30px rgba(33,54,110,.08);
      backdrop-filter:blur(3px);
    }
    h1{
      margin:0 0 12px;
      font-size:clamp(32px,4vw,54px);
      line-height:1.06;
      letter-spacing:.2px;
    }
    .subtitle{
      margin:0;
      color:var(--muted);
      font-size:clamp(16px,1.9vw,22px);
    }
    .teacher{
      margin:8px 0 0;
      color:var(--muted);
      font-size:15px;
    }
    .teacher strong{
      font-size:20px;
      color:var(--ink);
      letter-spacing:.01em;
    }
    .teacher a{
      color:var(--primary);
      text-decoration:none;
      font-weight:700;
      text-transform:lowercase;
    }
    .status{
      margin:14px 0 0;
      color:var(--muted);
      font-size:15px;
    }
    .notice{
      margin:14px 0 0;
      padding:14px 16px;
      border:1px solid var(--line);
      border-left:4px solid var(--primary);
      border-radius:14px;
      background:rgba(219,231,255,.4);
      color:#3a4b6a;
      font-size:14px;
      line-height:1.7;
    }
    .grid{
      margin-top:24px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(318px,1fr));
      gap:18px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:20px;
      box-shadow:0 8px 24px rgba(31,58,124,.06);
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:390px;
    }
    .card-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }
    .badge{
      background:var(--primary-soft);
      color:var(--primary);
      border-radius:999px;
      padding:6px 12px;
      font-weight:800;
      letter-spacing:.08em;
      font-size:13px;
      text-transform:uppercase;
    }
    .state{
      border-radius:999px;
      padding:6px 12px;
      font-weight:700;
      font-size:13px;
      color:var(--ok);
      background:var(--ok-soft);
    }
    .name{
      margin:0;
      font-size:30px;
      line-height:1.08;
    }
    .group{
      margin:2px 0 0;
      color:var(--muted);
      font-size:16px;
    }
    .meta{
      border:1px solid var(--line);
      border-radius:18px;
      background:#f6f9ff;
      padding:12px;
      display:grid;
      gap:7px;
    }
    .meta-row{
      font-size:15px;
      color:#344565;
      display:flex;
      gap:8px;
      align-items:baseline;
    }
    .meta-key{
      color:var(--primary);
      font-weight:800;
      min-width:66px;
    }
    .meta-value{
      color:#5a6884;
      white-space:normal;
      overflow-wrap:anywhere;
      word-break:break-word;
      display:block;
      flex:1;
    }
    .why{
      border:1px solid var(--line);
      border-left:4px solid var(--ok);
      border-radius:14px;
      background:var(--ok-soft);
      padding:11px 13px;
      font-size:14px;
      line-height:1.65;
      color:#2f4636;
    }
    .why-key{
      display:block;
      font-weight:800;
      font-size:12px;
      letter-spacing:.06em;
      color:var(--ok);
      margin-bottom:4px;
      text-transform:uppercase;
    }
    .work{
      margin-top:auto;
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px;
      background:#fbfdff;
    }
    .filename{
      margin:0 0 10px;
      font-size:15px;
      color:#3a4b6a;
      word-break:break-all;
    }
    .actions{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      gap:10px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      border-radius:14px;
      text-decoration:none;
      font-weight:700;
      border:1px solid var(--line);
      color:var(--ink);
      background:#fff;
      transition:all .15s ease;
    }
    .btn:hover{ transform:translateY(-1px); border-color:#9eb5e9; }
    .btn.primary{
      color:#fff;
      border-color:var(--primary);
      background:linear-gradient(180deg,#3a6bf0 0%,#2a59d1 100%);
    }
    .note{
      margin:0 0 10px;
      font-size:14px;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>优秀个人作品合集</h1>
      <p class="subtitle">CHI1293《中华与世界：文明互鉴与未来展望》</p>
      <p class="teacher">任课教师：<strong>Maya Siqing LI</strong> · <a href="https://www.bnbu.edu.cn/faculty.htm#/mayasqli/cn" target="_blank" rel="noreferrer">个人主页</a></p>
      <p class="notice">说明：本平台展示的是课程负责人从全部 96 名学生的个人作品中遴选出的部分优秀成果，并非全部学生作品的公开展示。个人作业采用"随机分配"机制——每位学生被随机分配一个学科专业方向与一个中华文明主题，需运用课程所学 AI 工具创造性地生成一项数字人文成果。其余学生作品均已由课程负责人完成备份存档；展示平台仍在持续建设与完善中，后续将视情况进一步更新。</p>
      <p class="status" id="status">正在加载个人作品…</p>
    </section>
    <section class="grid" id="grid"></section>
  </main>

  <script>
    const WORKS = [
      { group: "Group 1", name: "易欣悦 Jade", aiTool: "Vibe coding", civA: "Yuan China", civB: "Islamic World", file: "works/individual/Group1_Assignment2__易欣悦_Assignment2__易欣悦_Assignment2.pptx", highlight: "用 vibe coding 亲手做出并部署可交互网站，把元代郭守敬与扎马鲁丁的中伊天文交流，转化为关于科学“可见性”与命名权的视觉论证，问题意识与技术落地都很扎实。" },
      { group: "Group 1", name: "李炜桐 ASA", aiTool: "Dify", civA: "Modern China", civB: "Southeast Asia (Nanyang)", file: "works/individual/Group1_Assignment2__李炜桐_Assignment2__李炜桐_Assignment2.pptx", highlight: "以“侨批”为线索，用 Marble 三维世界模型还原潮汕与南洋骑楼的建筑对话，把经济与建筑文明的跨海联系做成可游览的 AI 世界，技术运用很有野心。" },
      { group: "Group 1", name: "王嫣然 Rianna", aiTool: "Codex", civA: "Chinese Civilization", civB: "Western Civilization", file: "works/individual/Group1_Assignment2__王嫣然_Assignment2__王嫣然_Assignment2.pptx", highlight: "独立完成并部署了一个 AI 视觉作品网站，把中西文明比较落地为可在线访问的完整作品。" },
      { group: "Group 1", name: "张亦乐 Letitia", aiTool: "Claude Design and Codex", civA: "Silk Road / Tang China", civB: "Cold War Socialist Europe", file: "works/individual/Group1_张亦乐_Letitia_Assignment2.pptx", highlight: "用 Claude Design 与 Codex 从零搭建网站，把丝绸之路与冷战两种政治文明的“能动性”对比做成有设计感的交互页面，工具理解与审美都很到位。", websiteLink: "works/letitia-ai/index.html", websiteLabel: "查看 AI 作品" },
      { group: "Group 2", name: "夏晨骞 Zane", aiTool: "Midjourney", civA: "Sanxingdui (Ancient China)", civB: "West/Central Asian Civilizations", file: "works/individual/Group2_Assignment2__夏晨骞_Assignment2__夏晨骞_Assignment2.pptx", highlight: "从科技史视角重读三星堆，论证古蜀技术是东亚—中亚—西亚交流网络中的双向节点，史料与论点都很清晰。" },
      { group: "Group 2", name: "王俊博 Stephen", aiTool: "Kling AI (可灵), ChatGPT, Image2", civA: "Chinese Civilization", civB: "Western Civilization", file: "works/individual/Group2_Assignment2__王俊博_Assignment2__王俊博_Assignment2.pptx", highlight: "用可灵 AI 把冷战“爵士外交”做成电影感影像——地图化为五线谱——巧妙地把“对外自由、对内不平等”的张力视觉化。" },
      { group: "Group 2", name: "胡峻铭 Jimmy Hu", aiTool: "Seedance", civA: "Chinese Civilization", civB: "Christian/Islamic-Western Civilizations", file: "works/individual/Group2_Assignment2__胡峻铭_Assignment2__胡峻铭_Assignment2.pptx", highlight: "比较东西方“宗教与政治”的关系，用 Seedance 生成影像辅助论证，并坦诚分析了工具的长短板，反思意识难得。" },
      { group: "Group 2", name: "黄麒润 Karen", aiTool: "Claude, ChatGPT, and DeepSeek", civA: "Chinese Civilization", civB: "Western Civilization", file: "works/individual/Group2_Assignment2__黄麒润_Assignment2__黄麒润_Assignment2.pptx", highlight: "以“权威矩阵”为框架，借 Asad、Weber 等宗教学理论，把神圣权威与政治权威千年的博弈梳理成清晰的“压力测试”模型，理论深度突出。" },
      { group: "Group 3", name: "刘畅 Grace", aiTool: "豆包", civA: "Chinese Civilization", civB: "Sogdian/Central Asian Civilization", file: "works/individual/Group3_Assignment2__刘畅_Assignment2__刘畅_Assignment2.pptx", highlight: "提出“语言是经济信任的基础设施”这一新颖切口，结合中原与粟特商贸，并配套 AI 视频呈现，视角独到。", aiLink: "https://www.bilibili.com/video/BV1cKLb6dEnz/", aiLabel: "查看 AI 视频" },
      { group: "Group 4", name: "刘雨萌 Icey", aiTool: "即梦 / Seedance 2.0", civA: "Chinese Civilization", civB: "Europe/Middle East Civilizations", file: "works/individual/Group4_Assignment2__刘雨萌_Assignment2__刘雨萌_Assignment2.pptx", highlight: "从考古学出发，用即梦/Seedance 让“无法拍摄的历史场景”重现，提出“技术不只是研究历史，而是重新激活历史”，立意打动人。" },
      { group: "Group 5", name: "张栩豪 Kevin", aiTool: "Codex, GPT Image 2, Tripo AI", civA: "European Civilization", civB: "Global Public Health Civilization", file: "works/individual/Group5_Assignment2__张栩豪_Assignment2__张栩豪_Assignment2.pptx", highlight: "抓住“贸易网络也是疾病传播网络”的犀利洞见，用 Codex+多工具流水线把瘟疫与公共卫生史串成一个“同构”的论证，结构与思想俱佳。" },
      { group: "Group 5", name: "林禹同 Gosling", aiTool: "Midjourney", civA: "Chinese Civilization", civB: "Islamic Civilization", file: "works/individual/Group5_Assignment2__林禹同_Assignment2__林禹同_Assignment2.pptx", highlight: "一幅“破碎光环”曼陀罗，将四大文明的视觉语言织成红十字，再以铁丝网撕裂、微光穿透，把“人道”的神圣与被政治工具化讲得极具感染力。" },
      { group: "Group 5", name: "熊大略 David Xiong", aiTool: "MiniMax, ML Sharp, + AI writing & illustration", civA: "Chinese Civilization", civB: "Western/Soviet Civilization", file: "works/individual/Group5_Assignment2__熊大略_Assignment2__熊大略_Assignment2.pptx", highlight: "以“一人公司”模式用 AI 走通写作—插画—配乐—三维全流程，甚至出版小说《1971 正义密稿》并创作主题曲，把冷战正义之争做成沉浸式叙事，完成度惊人。" },
      { group: "Group 5", name: "谢尚哲 Steve", aiTool: "ChatGPT and Midjourney", civA: "Chinese Civilization", civB: "Arabic/European Civilization", file: "works/individual/Group5_Assignment2__谢尚哲_Assignment2__谢尚哲_Assignment2.pptx", highlight: "用网络与图论给“数学丝绸之路”建模，把跨文明的数学知识流动做成可交互的拓扑地图，学科方法与主题结合得很专业。" },
      { group: "Group 5", name: "王振宇 Crystal", aiTool: "Claude Code", civA: "Late Qing China", civB: "Western Industrial Civilization", file: "works/individual/Group5_王振宇_Crystal_Assignment2.pptx", highlight: "用 Claude Code 做了一个 1866–1895 的可交互时间轴网页，借福州船政学堂讲清“教育与经济相互塑造”的逻辑，论证清晰、落地完整。", websiteLink: "https://fuzhou.progie25.top/", websiteLabel: "查看 AI 作品" },
      { group: "Group 7", name: "邓杰潆 Astoria", aiTool: "ChatGPT and Pika", civA: "Chinese Civilization", civB: "Western Civilization", file: "works/individual/Group7_Assignment2__邓杰潆_Assignment2__邓杰潆_Assignment2.pptx", highlight: "以“同一片星空”立意，把明清之际的天文交流讲成翻译、信任与跨文化理解的桥梁，再用 ChatGPT+Pika 让星图流动起来，温度与美感兼具。" },
      { group: "Group 7", name: "陆思辰 Stella", aiTool: "Seedance", civA: "Modern China", civB: "Global/Industrial Civilization", file: "works/individual/Group7_Assignment2__陆思辰_Assignment2__陆思辰_Assignment2.pptx", highlight: "以橡胶（“黑金”）500 年的绿色转型为线索，用 Seedance 把生态文明的长时段演变做成连贯叙事，选题与视觉叙事都很有想法。" },
      { group: "Group 8", name: "刘咏昭 Yongzhao", aiTool: "Midjourney", civA: "Chinese Civilization", civB: "Western Civilization", file: "works/individual/Group8_Assignment2__刘咏昭_Assignment2__刘咏昭_Assignment2.pptx", highlight: "以哲学切入，用 Midjourney（新海诚风格）+MiniMax 配音把 1920 与 2026 缝合成一部影像，让抽象的“逻辑源代码”有了人文温度，风格统一度很高。" },
      { group: "Group 8", name: "季玥彤 Yuetong", aiTool: "Seedance 2.0", civA: "Chinese Civilization", civB: "Western Civilization", file: "works/individual/Group8_Assignment2__季玥彤_Assignment2__季玥彤_Assignment2.pptx", highlight: "用 Seedance 的抽象剪影与低调光影，刻意剥离殖民时代被浪漫化的图像叙事，以克制的视觉语言完成对历史的再审视，审美很有自觉。" },
      { group: "Group 9", name: "刘博文 Eric", aiTool: "Vibe coding", civA: "Chinese Civilization", civB: "Islamic Civilization", file: "works/individual/Group9_Assignment2__刘博文_Assignment2__刘博文_Assignment2.pptx", highlight: "以中华与伊斯兰文明的互动为题，用大量原创视觉作品替代文字、完全以图像完成论证，视觉表达力突出。" },
      { group: "Group 9", name: "王科凯 Jason", aiTool: "Claude Code, Three.js / WebGL (interactive 3D globe)", civA: "Han China", civB: "Abbasid Islamic World", file: "works/individual/Group9_Assignment2__王科凯_Assignment2__王科凯_Assignment2.pptx", highlight: "以传播学视角追踪“纸”跨越五个文明的旅程，从造纸术西传讲到数字时代的平台权力，把媒介理论与文明史结合得很有思想。" }
    ];

    const grid = document.getElementById("grid");
    const status = document.getElementById("status");

    function fileName(path){
      return path.split("/").pop();
    }

    function buildActionButtons(item){
      const actions = [];
      if (item.file) {
        const shortName = fileName(item.file);
        actions.push(`<a class="btn" href="${item.file}" target="_blank" rel="noreferrer">查看 PPT</a>`);
        actions.push(`<a class="btn primary" href="${item.file}" download="${shortName}">下载 PPT</a>`);
      }
      if (item.websiteLink) {
        actions.push(`<a class="btn" href="${item.websiteLink}" target="_blank" rel="noreferrer">${item.websiteLabel || "打开网页"}</a>`);
      }
      if (item.aiLink) {
        actions.push(`<a class="btn" href="${item.aiLink}" target="_blank" rel="noreferrer">${item.aiLabel || "查看 AI 作品"}</a>`);
      }
      return actions.join("");
    }

    function buildCard(item, idx){
      const title = item.name;
      const workLabel = item.file ? (item.fileLabel || "演示文件见下方。") : "相关作品链接见下方。";
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="card-top">
          <span class="badge">学生 ${String(idx + 1).padStart(2, "0")}</span>
          <span class="state">已就绪</span>
        </div>
        <h2 class="name">${title}</h2>
        <p class="group">第 ${item.group.replace(/\D/g,"")} 组</p>
        <div class="meta">
          <div class="meta-row"><span class="meta-key">AI 工具：</span><span class="meta-value">${item.aiTool}</span></div>
          <div class="meta-row"><span class="meta-key">文明 1：</span><span class="meta-value">${item.civA}</span></div>
          <div class="meta-row"><span class="meta-key">文明 2：</span><span class="meta-value">${item.civB}</span></div>
        </div>
        ${item.highlight ? `<div class="why"><span class="why-key">亮点</span>${item.highlight}</div>` : ""}
        <div class="work">
          <p class="filename">${workLabel}</p>
          ${item.note ? `<p class="note">${item.note}</p>` : ""}
          <div class="actions">${buildActionButtons(item)}</div>
        </div>
      `;
      return card;
    }

    WORKS.forEach((item, idx) => grid.appendChild(buildCard(item, idx)));
    status.textContent = `已加载 ${WORKS.length} 份个人优秀作品。`;
  </script>
</body>
</html>
